<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo:wght@600;800&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
<style>
body { margin: 0; background: #F7F3EA; }
a { color: #6C4BA6; }
a:hover { color: #1A1712; }
</style>
</helmet>
<div style="min-height:100vh;background:#F7F3EA;color:#1A1712;font-family:'Hanken Grotesk',system-ui,sans-serif;padding:56px 48px 80px">
  <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6C4BA6">Favicon / chi-rho · diagonal penuh</div>
  <h1 style="font-family:Archivo,sans-serif;font-weight:800;font-size:38px;letter-spacing:-.02em;margin:10px 0 40px">Diagonal sudut ke sudut</h1>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;max-width:1100px">

    <div style="background:#fff;border:1px solid rgba(26,23,18,.12);padding:26px">
      <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6C4BA6;margin-bottom:6px">G — Garis tipis</div>
      <div style="font-size:13px;color:rgba(26,23,18,.55);margin-bottom:18px">Diagonal 8px, paling halus</div>
      <img src="assets/fav-h2.png" alt="D" style="width:100%;display:block" />
      <div style="display:flex;align-items:flex-end;gap:20px;margin-top:22px;padding-top:20px;border-top:1px solid rgba(26,23,18,.1)">
        <img src="assets/fav-h2.png" alt="" style="width:64px;height:64px;display:block" />
        <img src="assets/fav-h2.png" alt="" style="width:32px;height:32px;display:block" />
        <img src="assets/fav-h2.png" alt="" style="width:16px;height:16px;display:block" />
        <div style="font-family:'Space Mono',monospace;font-size:10px;color:rgba(26,23,18,.5);letter-spacing:.1em">64 · 32 · 16</div>
      </div>
    </div>

    <div style="background:#fff;border:1px solid rgba(26,23,18,.12);padding:26px">
      <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6C4BA6;margin-bottom:6px">H — Garis sedang</div>
      <div style="font-size:13px;color:rgba(26,23,18,.55);margin-bottom:18px">Diagonal 14px, seimbang</div>
      <img src="assets/fav-h1.png" alt="E" style="width:100%;display:block" />
      <div style="display:flex;align-items:flex-end;gap:20px;margin-top:22px;padding-top:20px;border-top:1px solid rgba(26,23,18,.1)">
        <img src="assets/fav-h1.png" alt="" style="width:64px;height:64px;display:block" />
        <img src="assets/fav-h1.png" alt="" style="width:32px;height:32px;display:block" />
        <img src="assets/fav-h1.png" alt="" style="width:16px;height:16px;display:block" />
        <div style="font-family:'Space Mono',monospace;font-size:10px;color:rgba(26,23,18,.5);letter-spacing:.1em">64 · 32 · 16</div>
      </div>
    </div>

    <div style="background:#fff;border:1px solid rgba(26,23,18,.12);padding:26px">
      <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6C4BA6;margin-bottom:6px">I — Garis tebal</div>
      <div style="font-size:13px;color:rgba(26,23,18,.55);margin-bottom:18px">Diagonal 22px, paling kuat di 16px</div>
      <img src="assets/fav-h3.png" alt="F" style="width:100%;display:block" />
      <div style="display:flex;align-items:flex-end;gap:20px;margin-top:22px;padding-top:20px;border-top:1px solid rgba(26,23,18,.1)">
        <img src="assets/fav-h3.png" alt="" style="width:64px;height:64px;display:block" />
        <img src="assets/fav-h3.png" alt="" style="width:32px;height:32px;display:block" />
        <img src="assets/fav-h3.png" alt="" style="width:16px;height:16px;display:block" />
        <div style="font-family:'Space Mono',monospace;font-size:10px;color:rgba(26,23,18,.5);letter-spacing:.1em">64 · 32 · 16</div>
      </div>
    </div>
  </div>

  <div style="margin-top:44px;display:flex;align-items:center;gap:14px;background:#1A1712;padding:14px 18px;max-width:560px">
    <img src="assets/fav-h2.png" alt="" style="width:18px;height:18px" />
    <img src="assets/fav-h1.png" alt="" style="width:18px;height:18px" />
    <img src="assets/fav-h3.png" alt="" style="width:18px;height:18px" />
    <div style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;color:#C9E45B;text-transform:uppercase">Ukuran tab · G · H · I</div>
  </div>
</div>
</x-dc>
</body>
</html>
